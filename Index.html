<!DOCTYPE html>
<html>
<head>
<title>Glow & Co. Med Spa</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<h1>Glow & Co. Med Spa</h1>

<input id="msg" placeholder="Ask us anything">
<button onclick="send()">Send</button>

<p id="reply"></p>

<script>
const webhook = "https://hook.us2.make.com/i8cc44zl29fr3k99dg8gtsnf9w76vvyh";

async function send() {
  const message = document.getElementById("msg").value;
  const response = await fetch(webhook + "?message=" + encodeURIComponent(message));
  document.getElementById("reply").innerText = await response.text();
}
</script>

</body>
</html>
