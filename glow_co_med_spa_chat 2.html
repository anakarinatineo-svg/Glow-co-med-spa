<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glow & Co. Med Spa</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Georgia,serif;background:linear-gradient(135deg,#f7efe9,#eee4dc);min-height:100vh;display:grid;place-items:center;color:#3e3430}
.chat{width:min(430px,94vw);height:700px;background:#fffaf7;border-radius:28px;box-shadow:0 20px 60px #5b40351f;overflow:hidden;display:flex;flex-direction:column}
.header{padding:28px 24px;background:#3e3430;color:#fffaf7}
.brand{font-size:25px;letter-spacing:.5px}.sub{font:13px Arial,sans-serif;opacity:.78;margin-top:5px}
.messages{flex:1;padding:22px;overflow:auto;font:15px Arial,sans-serif}
.msg{max-width:82%;padding:13px 15px;border-radius:18px;margin:10px 0;line-height:1.45}
.bot{background:#eee4dc;border-bottom-left-radius:5px}.user{background:#3e3430;color:white;margin-left:auto;border-bottom-right-radius:5px}
.input{display:flex;gap:10px;padding:15px;border-top:1px solid #eadfd8}
input{flex:1;border:1px solid #d8cbc3;border-radius:22px;padding:13px 16px;outline:none}
button{border:0;border-radius:22px;padding:0 20px;background:#3e3430;color:white;font-weight:bold}
.note{font:11px Arial,sans-serif;color:#897a72;text-align:center;padding:0 18px 12px}
</style>
</head>
<body>
<div class="chat">
  <div class="header"><div class="brand">Glow & Co. Med Spa</div><div class="sub">Personalized beauty & wellness care</div></div>
  <div class="messages" id="messages">
    <div class="msg bot">Hi! Welcome to Glow & Co. How can I help you today?</div>
  </div>
  <div class="note">For medical questions, please speak with our staff.</div>
  <form class="input" id="form">
    <input id="input" placeholder="Ask about services or pricing…" autocomplete="off">
    <button>Send</button>
  </form>
</div>
<script>
const WEBHOOK = "https://hook.us2.make.com/i8cc44zl29fr3k99dg8gtsnf9w76vvyh";
const messages = document.getElementById("messages");
const input = document.getElementById("input");
function add(text, cls){const d=document.createElement("div");d.className="msg "+cls;d.textContent=text;messages.appendChild(d);messages.scrollTop=messages.scrollHeight}
document.getElementById("form").addEventListener("submit", async e=>{
 e.preventDefault(); const text=input.value.trim(); if(!text)return;
 add(text,"user"); input.value="";
 add("One moment…","bot"); const loading=messages.lastChild;
 try{
   const r=await fetch(WEBHOOK+"?message="+encodeURIComponent(text));
   const answer=await r.text();
   loading.remove(); add(answer || "Please contact our staff for help.","bot");
 }catch(err){loading.remove();add("Sorry, I couldn't connect right now. Please contact our staff.","bot")}
});
</script>
</body>
</html>
